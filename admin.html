<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實驗室後台管理系統 (Admin Dashboard)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: "Microsoft JhengHei", "Heiti TC", sans-serif; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        /* 平滑移動動畫 */
        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons ---
        const MenuIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;
        const CloseIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;

        const TAB_NAMES = { 
            news: '最新消息', 
            projects: '計畫管理', 
            members: '成員管理', 
            publications: '發表論文', 
            gallery: '生活寫真' 
        };

        const supabaseUrl = "https://uyvyxkrikmdyypppqsdt.supabase.co"; 
        const supabaseKey = "sb_publishable_AR5cKUsnsxgFRcC1rDCWlQ_mYRrxVUC"; 

        const getCredentials = () => ({ 
            username: localStorage.getItem('smsmp_admin_user') || 'yflin', 
            password: localStorage.getItem('smsmp_admin_pass') || '0701' 
        });

        const updateCredentials = (u, p) => {
            localStorage.setItem('smsmp_admin_user', u);
            localStorage.setItem('smsmp_admin_pass', p);
        };

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 800;
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                        else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        };

        const fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        // --- 登入介面 ---
        const LoginForm = ({ onLogin }) => {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [err, setErr] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                const creds = getCredentials();
                if (u === creds.username && p === creds.password) onLogin();
                else setErr('帳號或密碼錯誤');
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                    <div className="bg-white p-8 md:p-10 rounded-[32px] shadow-2xl w-full max-w-sm border border-slate-200">
                        <div className="text-center mb-8">
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">SMSMP Lab 後台</h2>
                            <p className="text-slate-400 text-sm mt-2">管理系統登入</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input className="w-full border-2 border-slate-100 p-4 rounded-2xl focus:border-blue-500 outline-none transition-all" placeholder="管理帳號" value={u} onChange={e=>setU(e.target.value)} required />
                            <input className="w-full border-2 border-slate-100 p-4 rounded-2xl focus:border-blue-500 outline-none transition-all" type="password" placeholder="管理密碼" value={p} onChange={e=>setP(e.target.value)} required />
                            {err && <p className="text-red-500 text-center text-sm font-bold bg-red-50 py-2 rounded-xl">{err}</p>}
                            <button className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-700 transition-all shadow-xl shadow-blue-200">進入系統</button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- 修改密碼視窗 ---
        const ChangePasswordModal = ({ isOpen, onClose }) => {
            const [oldPass, setOldPass] = useState('');
            const [newPass, setNewPass] = useState('');
            const [confirmPass, setConfirmPass] = useState('');
            const [msg, setMsg] = useState({ type: '', text: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                const current = getCredentials();
                if (oldPass !== current.password) {
                    setMsg({ type: 'error', text: '舊密碼驗證失敗' });
                    return;
                }
                if (newPass !== confirmPass) {
                    setMsg({ type: 'error', text: '新密碼與確認密碼不符' });
                    return;
                }
                updateCredentials(current.username, newPass);
                setMsg({ type: 'success', text: '修改成功！即將重新登入...' });
                setTimeout(() => window.location.reload(), 1500);
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-[32px] shadow-2xl w-full max-w-md p-6 md:p-8">
                        <h3 className="text-xl font-black mb-6 text-slate-800 flex items-center gap-2">🔒 修改管理密碼</h3>
                        {msg.text && <div className={`p-4 mb-6 rounded-2xl text-sm font-bold ${msg.type==='error'?'bg-red-50 text-red-600':'bg-green-50 text-green-600'}`}>{msg.text}</div>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <label className="block text-xs font-bold text-slate-400 mb-2 uppercase">驗證當前密碼</label>
                                <input type="password" placeholder="請輸入舊密碼" value={oldPass} onChange={e => setOldPass(e.target.value)} className="w-full border-2 border-white p-3 rounded-xl focus:border-blue-300 outline-none" required />
                            </div>
                            <div className="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                                <label className="block text-xs font-bold text-blue-400 mb-2 uppercase">設定新密碼</label>
                                <input type="password" placeholder="輸入新密碼" value={newPass} onChange={e => setNewPass(e.target.value)} className="w-full border-2 border-white p-3 rounded-xl mb-3 focus:border-blue-300 outline-none" required />
                                <input type="password" placeholder="再次確認新密碼" value={confirmPass} onChange={e => setConfirmPass(e.target.value)} className="w-full border-2 border-white p-3 rounded-xl focus:border-blue-300 outline-none" required />
                            </div>
                            <div className="flex justify-end gap-3 mt-8">
                                <button type="button" onClick={onClose} className="px-6 py-3 border rounded-xl font-bold">取消</button>
                                <button type="submit" className="px-6 py-3 bg-blue-600 text-white rounded-xl font-black">儲存變更</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- 編輯視窗 ---
        const EditorModal = ({ activeTab, initData, onSave, onBatchSave, onClose }) => {
            const [formData, setFormData] = useState({ dateMode: 'single', ...initData });
            const [galleryImages, setGalleryImages] = useState([]);
            const [isSaving, setIsSaving] = useState(false);
            const [fileError, setFileError] = useState('');
            const MAX_FILE_SIZE = 2 * 1024 * 1024; // 2MB

            const handleFile = async (e) => {
                setFileError('');
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                if (activeTab === 'publications') {
                    if (files[0].size > MAX_FILE_SIZE) {
                        setFileError('檔案太大！請上傳小於 2MB 的 PDF。');
                        e.target.value = null; return;
                    }
                    const base64 = await fileToBase64(files[0]);
                    setFormData(p => ({ ...p, pdfFile: base64, pdfName: files[0].name }));
                } else {
                    const compressed = await Promise.all(files.map(f => compressImage(f)));
                    if (activeTab === 'gallery') setGalleryImages(prev => [...prev, ...compressed.map(src => ({src}))]);
                    else setFormData(p => ({ ...p, [activeTab === 'members' ? 'photo' : 'image']: compressed[0] }));
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                try {
                    if (activeTab === 'gallery' && !formData.id && galleryImages.length > 1) {
                        const items = galleryImages.map((img, idx) => ({ ...formData, src: img.src, createdAt: Date.now() - idx * 1000 }));
                        await onBatchSave(items);
                    } else {
                        await onSave(formData);
                    }
                    onClose();
                } catch (err) { alert("儲存失敗"); }
                finally { setIsSaving(false); }
            };

            return (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[110] p-4 backdrop-blur-sm overflow-y-auto custom-scrollbar">
                    <div className="bg-white rounded-[32px] shadow-2xl w-full max-w-2xl p-6 md:p-10 relative my-auto">
                        <h3 className="text-2xl md:text-3xl font-black mb-6 text-slate-800">{formData.id ? '編輯' : '新增'}{TAB_NAMES[activeTab]}</h3>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-2">主要名稱 / 標題</label>
                                <input required value={formData.title || formData.name || ''} onChange={e=>setFormData({...formData, [activeTab==='members'?'name':'title']:e.target.value})} className="w-full border-2 border-slate-100 p-3 md:p-4 rounded-2xl focus:border-blue-500 outline-none font-bold" />
                            </div>

                            {activeTab === 'projects' && (
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="col-span-1">
                                        <label className="block text-xs font-bold text-slate-500 mb-1">計畫年度</label>
                                        <input placeholder="113" value={formData.planYear || ''} onChange={e=>setFormData({...formData, planYear:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl focus:border-blue-500 outline-none" />
                                    </div>
                                    <div className="col-span-1">
                                        <label className="block text-xs font-bold text-slate-500 mb-1">執行年度</label>
                                        <input placeholder="113-114" value={formData.execYear || ''} onChange={e=>setFormData({...formData, execYear:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl focus:border-blue-500 outline-none" />
                                    </div>

                                    <div className="col-span-2 space-y-3">
                                        <div className="flex gap-2">
                                            <button type="button" onClick={()=>setFormData({...formData, dateMode: 'single'})} className={`flex-1 py-2 text-xs rounded-lg font-bold border-2 transition-all ${formData.dateMode==='single'?'bg-blue-600 border-blue-600 text-white':'bg-white text-slate-400'}`}>單一日期</button>
                                            <button type="button" onClick={()=>setFormData({...formData, dateMode: 'range'})} className={`flex-1 py-2 text-xs rounded-lg font-bold border-2 transition-all ${formData.dateMode==='range'?'bg-blue-600 border-blue-600 text-white':'bg-white text-slate-400'}`}>時間分段</button>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3 bg-slate-50 p-4 rounded-2xl">
                                            <input type="date" required value={formData.startDate || ''} onChange={e=>{
                                                const d = e.target.value;
                                                const y = d ? (new Date(d).getFullYear() - 1911) : '';
                                                setFormData({...formData, startDate: d, year: y.toString(), planYear: formData.planYear || y.toString()});
                                            }} className="w-full border-2 border-white p-2 rounded-xl text-sm" />
                                            {formData.dateMode === 'range' && <input type="date" required value={formData.endDate || ''} onChange={e=>setFormData({...formData, endDate:e.target.value})} className="w-full border-2 border-white p-2 rounded-xl text-sm" />}
                                        </div>
                                    </div>

                                    <div className="col-span-2">
                                        <label className="block text-xs font-bold text-slate-500 mb-1">標籤與單位</label>
                                        <div className="flex flex-col gap-3">
                                            <select value={formData.type || 'government'} onChange={e=>setFormData({...formData, type:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl text-sm">
                                                <option value="government">國科會 / 教育部計畫</option><option value="industry">產學合作計畫</option><option value="research">一般研究計畫</option>
                                            </select>
                                            <input placeholder="委託單位" value={formData.agency||''} onChange={e=>setFormData({...formData, agency:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl text-sm" />
                                            <input placeholder="主持人" value={formData.role||''} onChange={e=>setFormData({...formData, role:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl text-sm" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'publications' && (
                                <div className="space-y-4">
                                    <input value={formData.authors || ''} onChange={e=>setFormData({...formData, authors:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl" placeholder="作者列表 (Authors)" />
                                    <div className="grid grid-cols-2 gap-3">
                                        <input type="date" required value={formData.fullDate || ''} onChange={e => {
                                            const d = e.target.value; const y = d ? new Date(d).getFullYear() : '';
                                            setFormData({...formData, fullDate: d, year: y.toString()});
                                        }} className="w-full border-2 border-slate-100 p-3 rounded-2xl text-sm" />
                                        <input value={formData.venue || ''} onChange={e=>setFormData({...formData, venue:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl text-sm" placeholder="期刊名稱 (Venue)" />
                                    </div>
                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                        <div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-slate-600">PDF 檔案 (2MB 內)</span></div>
                                        <input type="file" accept="application/pdf" onChange={handleFile} className="w-full text-xs" />
                                        {fileError && <p className="text-red-500 text-[10px] font-bold mt-1">{fileError}</p>}
                                        {formData.pdfName && <div className="mt-2 text-[10px] font-bold text-blue-600 truncate">📄 {formData.pdfName}</div>}
                                    </div>
                                    <input value={formData.url || ''} onChange={e=>setFormData({...formData, url:e.target.value})} className="w-full border-2 border-blue-50 p-3 rounded-2xl bg-blue-50/20 text-xs" placeholder="或輸入雲端網址 URL" />
                                </div>
                            )}

                            {activeTab === 'news' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <input type="date" value={formData.date||''} onChange={e=>setFormData({...formData, date:e.target.value})} className="border-2 border-slate-100 p-3 rounded-2xl" />
                                    <select value={formData.tag||'Activity'} onChange={e=>setFormData({...formData, tag:e.target.value})} className="border-2 border-slate-100 p-3 rounded-2xl">
                                        <option value="Activity">一般動態</option><option value="Award">榮譽獲獎</option>
                                    </select>
                                </div>
                            )}

                            {activeTab === 'members' && (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">身分類別</label>
                                            <select value={formData.type||'alumni'} onChange={e=>setFormData({...formData, type:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl text-sm">
                                                <option value="pi">指導教授</option><option value="phd">博士生</option><option value="master">碩士生</option><option value="alumni">畢業校友</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 mb-1">年度</label>
                                            <input placeholder="例如：114" value={formData.year||''} onChange={e=>setFormData({...formData, year:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl text-sm" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">論文題目</label>
                                        <textarea placeholder="請輸入論文題目" value={formData.thesis||''} onChange={e=>setFormData({...formData, thesis:e.target.value})} className="border-2 border-blue-100 bg-blue-50/20 p-3 rounded-2xl w-full h-24 text-sm focus:border-blue-400 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">畢業流向</label>
                                        <textarea placeholder="例如：任職公司、職稱、升學、創業、待補" value={formData.graduateFlow || formData.career || ''} onChange={e=>setFormData({...formData, graduateFlow:e.target.value, career:e.target.value})} className="border-2 border-emerald-100 bg-emerald-50/20 p-3 rounded-2xl w-full h-24 text-sm focus:border-emerald-400 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">產業類別</label>
                                        <input placeholder="例如：半導體、工具機、精密製造、升學研究、待補" value={formData.industryCategory || ''} onChange={e=>setFormData({...formData, industryCategory:e.target.value})} className="border-2 border-orange-100 bg-orange-50/20 p-3 rounded-2xl w-full text-sm focus:border-orange-400 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">研究方向／備註</label>
                                        <textarea placeholder="研究方向詳細內容..." value={formData.researchDetail||''} onChange={e=>setFormData({...formData, researchDetail:e.target.value})} className="border-2 border-slate-100 p-3 rounded-2xl w-full h-20 text-sm" />
                                    </div>
                                </div>
                            )}


                            {activeTab === 'gallery' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">照片年度</label>
                                        <input placeholder="例如：114" value={formData.year || ''} onChange={e=>setFormData({...formData, year:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 mb-1">活動日期</label>
                                        <input type="date" value={formData.date || ''} onChange={e=>setFormData({...formData, date:e.target.value})} className="w-full border-2 border-slate-100 p-3 rounded-2xl text-sm" />
                                    </div>
                                </div>
                            )}

                            {activeTab !== 'projects' && activeTab !== 'publications' && (
                                <div className="p-4 bg-slate-50 rounded-2xl">
                                    <label className="block text-xs font-bold text-slate-500 mb-2">圖片上傳</label>
                                    <input type="file" multiple={activeTab==='gallery'} accept="image/*" onChange={handleFile} className="w-full text-xs" />
                                    <div className="flex gap-2 mt-3 overflow-x-auto p-1">
                                        {(activeTab === 'gallery' ? galleryImages : [{src: formData.photo || formData.image}]).map((img, i) => img.src && (
                                            <img key={i} src={img.src} className="w-16 h-16 object-cover rounded-lg border shadow-sm" />
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="flex gap-3 pt-6 border-t">
                                <button type="button" onClick={onClose} className="flex-1 py-3 border-2 rounded-2xl font-bold text-slate-400">取消</button>
                                <button type="submit" disabled={isSaving} className="flex-1 py-3 bg-blue-600 text-white rounded-2xl font-black shadow-lg shadow-blue-100 disabled:opacity-50">
                                    {isSaving ? '處理中' : '儲存'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };


        const DEFAULT_STUDENTS_IMPORT = [
            {name:'賴柏丞', year:'114', type:'alumni', thesis:'基於田口方法與多目標最佳化預測之故障偵測於單晶矽切削加工特性之研究', career:'待補', graduateFlow:'待補', industryCategory:'待補'},
            {name:'廖子彥', year:'113', type:'alumni', thesis:'點膠頭加工後測試之影響', career:'待補', graduateFlow:'待補', industryCategory:'待補'},
            {name:'李瑜汝', year:'113', type:'alumni', thesis:'PCD微電極電漿加工品質與表面加工品質之影響', career:'待補', graduateFlow:'待補', industryCategory:'待補'},
            {name:'蔡治文', year:'113', type:'alumni', thesis:'熱處理對M390不鏽鋼銑削刀具磨耗與表面品質影響之研究', career:'待補', graduateFlow:'待補', industryCategory:'待補'},
            {name:'廖瑋婷', year:'113', type:'alumni', thesis:'自行車花鼓ISO 4210標準之CAE模擬與優化實驗分析', career:'待補', graduateFlow:'待補', industryCategory:'待補'},
            {name:'李宥廷', year:'113', type:'alumni', thesis:'應用自製雙變頻器與PID控制系統於單晶矽電漿石破切削之田口法與多目標最佳化預測研究', career:'待補', graduateFlow:'待補', industryCategory:'待補'},

            {name:'劉智偉', year:'108', type:'alumni', thesis:'減振構件之阻尼系統最佳化設計', career:'待補', graduateFlow:'待補', industryCategory:'待補'},
            {name:'陳家興', year:'108', type:'alumni', thesis:'三相感應馬達之最佳化與模擬分析', career:'待補', graduateFlow:'待補', industryCategory:'待補'}
        ];

        const AdminApp = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [tab, setTab] = useState('news');
            const [dataList, setDataList] = useState([]);
            const [loading, setLoading] = useState(false);
            const [editing, setEditing] = useState(null);
            const [isPwdModalOpen, setIsPwdModalOpen] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [supabase, setSupabase] = useState(null);

            useEffect(() => {
                setSupabase(window.supabase.createClient(supabaseUrl, supabaseKey));
            }, []);

            const loadData = async () => {
                if (!supabase) return;
                setLoading(true);
                const { data, error } = await supabase.from('lab_content').select('id, data').eq('collection', tab).order('created_at', { ascending: false });
                if (!error) setDataList(data.map(r => ({ id: r.id, ...r.data })));
                setLoading(false);
            };

            useEffect(() => { if (isLoggedIn && supabase) loadData(); }, [isLoggedIn, tab, supabase]);

            const handleSave = async (payload) => {
                const dataToSave = { collection: tab, data: { ...payload, updatedAt: Date.now() } };
                if (!payload.id) await supabase.from('lab_content').insert(dataToSave);
                else await supabase.from('lab_content').update({ data: payload }).eq('id', payload.id);
                loadData();
            };

            const handleBatchSave = async (items) => {
                const rows = items.map(item => ({ collection: tab, data: { ...item, createdAt: Date.now() } }));
                await supabase.from('lab_content').insert(rows);
                loadData();
            };

            const handleImportDefaultStudents = async () => {
                if (!supabase) return;
                if (!confirm(`確定要匯入 ${DEFAULT_STUDENTS_IMPORT.length} 筆歷屆學生資料嗎？
系統會自動略過已存在的「姓名＋論文題目」資料。`)) return;
                const { data: existingRows } = await supabase.from('lab_content').select('id, data').eq('collection', 'members').limit(1000);
                const existingKeys = new Set((existingRows || []).map(r => `${r.data?.name || ''}__${r.data?.thesis || ''}`));
                const rows = DEFAULT_STUDENTS_IMPORT
                    .filter(item => !existingKeys.has(`${item.name}__${item.thesis}`))
                    .map((item, idx) => ({ collection: 'members', data: { ...item, researchDetail: '歷屆研究生', createdAt: Date.now() - idx * 1000, updatedAt: Date.now() } }));
                if (rows.length === 0) { alert('沒有新資料需要匯入。'); return; }
                const { error } = await supabase.from('lab_content').insert(rows);
                if (error) alert('匯入失敗：' + error.message);
                else { alert(`已成功匯入 ${rows.length} 筆學生資料。`); if (tab !== 'members') setTab('members'); else loadData(); }
            };

            const handleDelete = async (id) => {
                if (confirm('確定要刪除嗎？')) { await supabase.from('lab_content').delete().eq('id', id); loadData(); }
            };

            if (!isLoggedIn) return <LoginForm onLogin={() => setIsLoggedIn(true)} />;

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-50 font-sans">
                    
                    {/* Mobile Header */}
                    <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 z-50">
                        <div className="font-black text-blue-400">SMSMP LAB</div>
                        <button onClick={()=>setIsSidebarOpen(!isSidebarOpen)} className="p-2 bg-slate-800 rounded-lg text-white">
                            {isSidebarOpen ? <CloseIcon /> : <MenuIcon />}
                        </button>
                    </div>

                    {/* Sidebar */}
                    <aside className={`fixed md:sticky top-0 left-0 h-screen w-72 bg-slate-900 text-white p-8 flex-shrink-0 shadow-2xl flex flex-col z-[100] sidebar-transition transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="mb-12 hidden md:block text-center">
                            <h1 className="text-2xl font-black text-blue-400 tracking-tighter">SMSMP LAB</h1>
                            <p className="text-slate-500 text-[10px] uppercase font-bold tracking-widest mt-1">Administrator</p>
                        </div>
                        <nav className="space-y-1 flex-grow">
                            {Object.entries(TAB_NAMES).map(([key, label]) => (
                                <button key={key} onClick={() => { setTab(key); setIsSidebarOpen(false); }} 
                                        className={`w-full text-left px-5 py-4 rounded-2xl transition-all font-bold flex items-center gap-3 ${tab===key ? 'bg-blue-600 shadow-lg scale-105' : 'hover:bg-slate-800 text-slate-400'}`}>
                                    <div className={`w-1.5 h-1.5 rounded-full ${tab===key ? 'bg-white' : 'bg-transparent'}`}></div>
                                    {label}
                                </button>
                            ))}
                            <div className="mt-8 pt-8 border-t border-slate-800 space-y-2">
                                <button onClick={() => {setIsPwdModalOpen(true); setIsSidebarOpen(false);}} className="w-full text-left px-5 py-4 rounded-2xl font-bold text-blue-400 border border-blue-900/30 hover:bg-blue-900/20 transition-all text-sm">🔒 修改管理密碼</button>
                                <a href="./index.html" className="w-full text-left px-5 py-4 rounded-2xl font-bold text-slate-400 hover:bg-slate-800 transition-all text-sm">🏠 返回前台網頁</a>
                            </div>
                        </nav>
                        <button onClick={() => window.location.reload()} className="mt-8 pt-6 border-t border-slate-800 text-xs text-slate-600 font-bold hover:text-slate-400 text-left">登出系統</button>
                    </aside>

                    {/* Overlay for Mobile Sidebar */}
                    {isSidebarOpen && <div onClick={()=>setIsSidebarOpen(false)} className="fixed inset-0 bg-black/60 z-[90] md:hidden backdrop-blur-sm"></div>}
                    
                    <main className="flex-grow p-4 md:p-12 overflow-y-auto h-screen custom-scrollbar">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 md:mb-12 gap-4">
                            <div>
                                <h2 className="text-3xl md:text-5xl font-black text-slate-800 tracking-tight">{TAB_NAMES[tab]}</h2>
                                <p className="text-slate-400 mt-2 font-medium hidden md:block">管理實驗室網站內容</p>
                            </div>
                            <div className="flex flex-col md:flex-row gap-3 w-full md:w-auto">
                                {tab === 'members' && <button onClick={handleImportDefaultStudents} className="w-full md:w-auto bg-emerald-600 text-white px-6 py-4 rounded-2xl shadow-xl shadow-emerald-100 hover:bg-emerald-700 font-black transition-all">一鍵匯入歷屆學生</button>}
                                <button onClick={() => setEditing({})} className="w-full md:w-auto bg-blue-600 text-white px-8 py-4 rounded-2xl shadow-xl shadow-blue-200 hover:bg-blue-700 font-black transition-all">+ 新增{TAB_NAMES[tab]}</button>
                            </div>
                        </header>

                        <div className="bg-white rounded-[24px] md:rounded-[40px] shadow-sm border border-slate-200 overflow-hidden">
                            {/* Desktop View Table */}
                            <table className="w-full text-left hidden md:table">
                                <thead className="bg-slate-50 border-b"><tr className="text-slate-500 text-xs uppercase font-black tracking-widest"><th className="p-8">內容描述</th><th className="p-8 text-right">管理操作</th></tr></thead>
                                <tbody className="divide-y divide-slate-100">
                                    {dataList.map(item => (
                                        <tr key={item.id} className="hover:bg-slate-50/50 transition-colors group">
                                            <td className="p-8">
                                                <div className="font-black text-slate-800 text-lg">{item.title || item.name}</div>
                                                {tab === 'members' && item.thesis && <div className="text-sm text-slate-500 font-bold mt-2 line-clamp-2">論文：{item.thesis}</div>}
                                                {tab === 'members' && (item.graduateFlow || item.career) && <div className="text-xs text-emerald-600 font-bold mt-1">畢業流向：{item.graduateFlow || item.career}</div>}
                                                <div className="text-[11px] text-slate-400 font-bold mt-1 flex gap-4 uppercase tracking-tighter">
                                                    {item.planYear && <span className="text-blue-500 px-2 py-0.5 bg-blue-50 rounded">計畫年度: {item.planYear}</span>}
                                                    {item.execYear && <span className="text-slate-500 px-2 py-0.5 bg-slate-100 rounded">執行年度: {item.execYear}</span>}
                                                    {!item.planYear && <span>{item.year || item.date || '----'}</span>}
                                                </div>
                                            </td>
                                            <td className="p-8 text-right space-x-4">
                                                <button onClick={() => setEditing(item)} className="text-blue-600 font-black hover:underline transition-all">編輯</button>
                                                <button onClick={() => handleDelete(item.id)} className="text-red-400 font-bold hover:underline transition-all">刪除</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>

                            {/* Mobile View Cards */}
                            <div className="md:hidden divide-y divide-slate-100">
                                {dataList.map(item => (
                                    <div key={item.id} className="p-5 space-y-3">
                                        <div>
                                            <div className="font-black text-slate-800">{item.title || item.name}</div>
                                            {tab === 'members' && item.thesis && <div className="text-xs text-slate-500 font-bold mt-1 line-clamp-2">論文：{item.thesis}</div>
                                            }
                                            {tab === 'members' && item.industryCategory && <div className="text-xs text-orange-600 font-bold mt-1">產業：{item.industryCategory}</div>}
                                            <div className="text-[10px] text-slate-400 font-bold mt-1 flex flex-wrap gap-2">
                                                {item.planYear && <span className="bg-blue-50 text-blue-600 px-2 py-0.5 rounded">年度: {item.planYear}</span>}
                                                {item.tag && <span className="bg-slate-100 text-slate-500 px-2 py-0.5 rounded">{item.tag}</span>}
                                                {!item.planYear && <span>{item.year || item.date || '----'}</span>}
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setEditing(item)} className="flex-1 bg-slate-50 py-3 rounded-xl text-blue-600 font-black text-sm">編輯</button>
                                            <button onClick={() => handleDelete(item.id)} className="flex-1 bg-slate-50 py-3 rounded-xl text-red-400 font-black text-sm">刪除</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            {dataList.length === 0 && <div className="p-20 text-center text-slate-300 font-bold">目前暫無資料</div>}
                        </div>
                    </main>
                    {editing && <EditorModal activeTab={tab} initData={editing} onSave={handleSave} onBatchSave={handleBatchSave} onClose={() => setEditing(null)} />}
                    <ChangePasswordModal isOpen={isPwdModalOpen} onClose={() => setIsPwdModalOpen(false)} />
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<AdminApp />);
        }
    </script>
</body>
